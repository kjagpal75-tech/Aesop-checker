# Aesop Shift Checker Log Rotation Configuration
# Deploy to: /etc/logrotate.d/aesop-checker

/home/kuljitjagpal/aesop-checker/app.log {
    # Rotate when log reaches 10MB
    size 10M
    
    # Keep 7 days of logs
    rotate 7
    
    # Don't rotate if log file is empty
    notifempty
    
    # Don't throw errors if log file is missing
    missingok
    
    # Compress old logs (but not the most recent one)
    compress
    delaycompress
    
    # Create new log file with proper permissions
    create 644 kuljitjagpal kuljitjagpal
    
    # Use copytruncate to avoid restarting the application
    copytruncate
    
    # Remove logs older than 7 days
    maxage 7
}
